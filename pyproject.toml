[project]
name = "batchward"
version = "0.1.0"
description = "An AI back-office team for Indian pharma distributors, built on Google ADK."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Divyansh" }]
dependencies = [
    "google-adk==2.9.*",
    "pydantic>=2.13",
]

[project.scripts]
batchward = "batchward.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/batchward"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q -m 'not slow and not live' --strict-markers"
markers = [
    "slow: minutes-long checks at realistic data volumes; run with `pytest -m slow`",
    "live: calls the real Gemini API; needs GOOGLE_API_KEY; run with `pytest -m live`",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# One row per molecule reads better than wrapped constructor calls.
"src/batchward/sim/catalogue.py" = ["E501"]
